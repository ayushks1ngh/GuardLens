# GuardLens 2.0 configuration (see docs/06-tech-decisions.md ADR-009).
# Everything here is overridable via GUARDLENS_<KEY> environment variables.

host: 0.0.0.0
port: 8080

# Storage (db_url derived from data_dir if left empty)
data_dir: data
db_url: ""

# Analysis
analysis_enabled: true
analyze_fps: 6.0
model_weights: yolov8n.pt
device: cpu

# Enabled detector plugins (resolved against the detector registry)
detectors:
  - key: object
    conf: 0.4
    imgsz: 640
  - key: face
    backend: opencv
    min_size: 40
    min_neighbors: 8      # higher = fewer false faces
    require_person: true  # a face must sit inside a detected person

# Enabled rules. Params remain JSON/config-driven; no schema changes are needed.
rules:
  - type: object_class
    name: person-watch
    severity: warning
    cooldown_seconds: 30
    params:
      classes: [person]
      min_confidence: 0.35
  - type: unknown_face
    name: face-policy
    severity: critical
    cooldown_seconds: 30
    params: {}

# Notifier plugins (configured at runtime via the API as well)
notifiers: []

# Activity log + daily report
reporting:
  activity_interval_seconds: 10.0
  retention_days: 30
  generator: structured

# Independent clip recorder (off by default until an operator enables it)
recording:
  enabled: false
  mode: event                 # off | motion | event | continuous
  pre_roll_seconds: 5
  post_roll_seconds: 10
  max_clip_seconds: 120
  segment_seconds: 300
  retention_days: 7
  quota_mb: 2048
  codec_preferences: [mp4v, MJPG]

# Data safety. Backups: nightly copy of the database into data/backups. Retention: events (and their pictures)
# older than events_days are removed, except unresolved critical alerts.
backup:
  enabled: true
  daily_at: "03:30"
  keep_days: 14
retention:
  enabled: true
  events_days: 90
